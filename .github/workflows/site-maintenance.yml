name: Personal site maintenance
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Saturday 07:00 Asia/Tehran
    - cron: '30 3 * * 6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-site-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/verify.py
      - run: node scripts/test_cms_oauth.mjs
      - run: node --test scripts/test_aus_gateway.mjs
      - run: node scripts/test_connection_check.mjs
