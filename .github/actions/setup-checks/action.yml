name: Prepare website checks
description: Locked local tools, browser and integrity-checked CMS test bundle
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
        cache: npm
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - shell: bash
      run: |
        set -euo pipefail
        npm ci --ignore-scripts
        python -m pip install -r requirements-cloudflare.txt
        npx playwright install --with-deps chromium
        node -e 'console.log("CHROMIUM_PATH=" + require("playwright").chromium.executablePath())' >> "$GITHUB_ENV"
        curl --fail --silent --show-error --location --max-time 60 https://cdn.jsdelivr.net/npm/decap-cms@3.10.0/dist/decap-cms.js --output "$RUNNER_TEMP/decap-cms.js"
        (cd "$RUNNER_TEMP" && sha256sum --check "$GITHUB_WORKSPACE/deploy/cms-bundle.sha256")
        echo "DECAP_BUNDLE=$RUNNER_TEMP/decap-cms.js" >> "$GITHUB_ENV"
